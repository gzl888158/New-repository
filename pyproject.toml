[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "okx_quant_trading"
version = "1.0.0"
description = "OKX量化交易系统 - 多策略并行量化交易平台"
authors = [
    { name = "Quant Team", email = "quant@example.com" }
]
readme = "docs/architecture.md"
license = { text = "MIT" }
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development :: Libraries",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.scripts]
okx-trading = "main:main"
okx-dashboard = "dashboard_api:main"

[project.dependencies]
okx = "2.1.2"
redis = "5.0.1"
sqlalchemy = "2.0.32"
websockets = "12.0"
pydantic = "2.7.1"
pyyaml = "6.0.1"
python-dotenv = "1.0.1"
schedule = "1.2.0"
psutil = "5.9.8"
requests = "2.31.0"
numpy = "1.26.4"
pandas = "2.2.1"
matplotlib = "3.8.4"
loguru = "0.7.2"
aiohttp = "3.9.3"
asyncio-mqtt = "0.16.2"
flask = "3.1.3"
flask-cors = "6.0.5"
tenacity = "9.1.4"

[project.optional-dependencies]
dev = [
    "ruff >= 0.1",
    "mypy >= 1.0",
    "pre-commit >= 3.0",
]
test = [
    "pytest >= 7.0",
    "pytest-asyncio >= 0.21",
    "pytest-cov >= 4.0",
]
prod = [
    "alembic >= 1.12",
    "py-spy >= 0.3",
    "pyinstaller >= 6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "perf: marks tests as performance tests",
]

[tool.coverage.run]
source = ["core", "strategies", "risk", "execution", "data", "utils", "analysis", "market_data", "execution", "monitoring", "configs"]
omit = ["*__init__.py", "*tests*", "*conftest*"]

[tool.coverage.report]
fail_under = 40
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 120
exclude = ["__pycache__", ".venv", "docs", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
exclude = ["__pycache__", ".venv", "docs", "tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["okx_quant_trading*"]
exclude = ["tests*", "docs*"]

[tool.alembic]
script_location = "alembic"
sqlalchemy.url = "sqlite:///data/trading.db"